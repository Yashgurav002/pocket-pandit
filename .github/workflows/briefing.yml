name: morning-briefing
on:
  schedule:
    - cron: "15 1 * * *"     # 01:15 UTC = 06:45 IST, 45 min before wake_up in config.yaml
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: briefing
jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GEMMA_MODEL: ${{ vars.GEMMA_MODEL || 'gemma3:4b' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: Install system and Python packages
        run: |
          sudo rm -f /var/lib/man-db/auto-update  # skip the slow man-page rebuild after apt installs
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg espeak-ng
          # CPU-only torch: the default wheel drags in GBs of CUDA libraries this runner can't use
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.ollama
            ~/.cache/huggingface
            ~/.cache/tabpfn
            data/training/raw
          key: models-v2-${{ vars.GEMMA_MODEL || 'gemma3:4b' }}
      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # The installer starts a system service storing models in /usr/share/ollama (not cached).
          # Run our own server instead, so models live in ~/.ollama and actions/cache keeps them.
          sudo systemctl stop ollama || true
          OLLAMA_MODELS=~/.ollama/models ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5
          ollama pull "$GEMMA_MODEL"
      - name: Refresh training data
        run: python -m ml.build_training
      - name: Build and publish briefing
        run: python -m pandit run
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          TABPFN_TOKEN: ${{ secrets.TABPFN_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Commit episode
        run: |
          git config user.name "pocket-pandit"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs data/state.json data/facts
          git commit -m "Episode $(TZ=Asia/Kolkata date +%F)"
          git pull --rebase && git push  # survive a push to main during the run
